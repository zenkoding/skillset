name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Doc rot guard
        run: make check-docs

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make validate
